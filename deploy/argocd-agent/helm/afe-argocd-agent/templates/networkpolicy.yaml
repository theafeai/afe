{{- if .Values.networkPolicy.enabled }}
{{- if or (not .Values.networkPolicy.apiServerCidrs) (not .Values.networkPolicy.afeCidrs) }}
{{- fail "networkPolicy.apiServerCidrs and networkPolicy.afeCidrs are required (or set networkPolicy.enabled=false)" }}
{{- end }}
# Egress only to DNS, the Kubernetes API server and Afe; no ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "afe-argocd-agent.fullname" . }}
  labels:
    {{- include "afe-argocd-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "afe-argocd-agent.selector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        {{- range .Values.networkPolicy.apiServerCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.apiServerPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    - to:
        {{- range .Values.networkPolicy.afeCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.afePort }}
{{- end }}
