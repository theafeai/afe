      :root {
        --bg: #ffffff;

        --panel: #f7f8fa;
        --github: #2f6feb;
        --argocd: #e0712c;
        --vercel: #6e40c9;
        --certain: #127a3a;
        --strong: #2f6feb;
        --probable: #b26b00;
        --weak: #b42318;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111418;
          --fg: #e6e8eb;
          --muted: #98a2b3;
          --line: #2a3038;
          --panel: #181c21;
          --certain: #4ac26b;
          --strong: #6ea8fe;
          --probable: #f0b429;
          --weak: #f97066;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
      header { padding: 16px; border-bottom: 1px solid var(--line); }
      h1 { margin: 0 0 4px; font-size: 18px; }
      .banner { color: var(--weak); font-weight: 600; }
      .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
      .lanes { display: grid; grid-template-columns: 90px repeat(3, minmax(0, 1fr)); }
      .lanes > div { padding: 6px 8px; border-bottom: 1px solid var(--line); min-width: 0; }
      .lanehead { position: sticky; top: 0; background: var(--bg); font-weight: 600; z-index: 1; }
      .time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
      .day { grid-column: 1 / -1; background: var(--panel); font-weight: 600; }
      .ev { border-left: 3px solid; padding: 3px 6px; border-radius: 4px; cursor: pointer; background: var(--panel); overflow-wrap: anywhere; }
      .ev.github { border-color: var(--github); }
      .ev.argocd { border-color: var(--argocd); }
      .ev.vercel { border-color: var(--vercel); }
      .ev.dim { opacity: 0.25; }
      .ev.sel { outline: 2px solid var(--fg); }
      .badge { display: inline-block; font-size: 11px; padding: 0 5px; border-radius: 8px; color: #fff; margin-left: 4px; }
      .c-certain { background: var(--certain); }
      .c-strong { background: var(--strong); }
      .c-probable { background: var(--probable); }
      .c-weak { background: var(--weak); }
      aside { border-left: 1px solid var(--line); padding: 12px 16px; position: sticky; top: 0; align-self: start; max-height: 100vh; overflow: auto; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; background: var(--panel); padding: 8px; border-radius: 4px; }
      .muted { color: var(--muted); }
      select { max-width: 100%; }
    </style>
  </head>

    <script>
      const D = JSON.parse(document.getElementById("afe-data").textContent);
      const label = (sha) => D.commitLabels[sha] || sha.slice(0, 7);
      const SOURCES = ["github", "argocd", "vercel"];
      const lanes = document.getElementById("lanes");
      const detail = document.getElementById("detail");
      const sel = document.getElementById("journey");
      const events = [...D.events].sort((a, b) => (a.occurredAt < b.occurredAt ? -1 : 1));
      const byId = Object.fromEntries(events.map((e) => [e.id, e]));

      sel.innerHTML = '<option value="">(none)</option>' +
        D.journeys.map((j, i) => `<option value="${i}">${j.repository.split("/").slice(1).join("/")} @ ${label(j.commitSha)}</option>`).join("");

      function summary(e) {
        const who = e.actor.login || e.actor.id || e.actor.type;
        const what = e.target.application || e.target.project || e.target.repository || e.target.id;
        return `<b>${e.action}</b> ${e.outcome !== "none" ? "(" + e.outcome + ")" : ""}<br><span class="muted">${what} · ${e.trigger.type} · ${who}</span>`;
      }

      function render() {
        const j = sel.value === "" ? null : D.journeys[+sel.value];
        const steps = j ? Object.fromEntries(j.steps.map((s) => [s.eventId, s])) : {};
        const excluded = j ? Object.fromEntries(j.excluded.map((x) => [x.eventId, x])) : {};
        let html = '<div class="lanehead">time</div>' + SOURCES.map((s) => `<div class="lanehead">${s}</div>`).join("");
        let day = "";
        for (const e of events) {
          const d = e.occurredAt.slice(0, 10);
          if (d !== day) { day = d; html += `<div class="day">${d}</div>`; }
          const s = steps[e.id];
          const x = excluded[e.id];
          const cls = ["ev", e.source, j && !s ? "dim" : ""].join(" ");
          const badge = s ? `<span class="badge c-${s.confidence}">${s.confidence}</span>` : x ? `<span class="badge c-weak">excluded</span>` : "";
          html += `<div class="time">${e.occurredAt.slice(11, 16)}</div>`;
          for (const src of SOURCES) {
            html += src === e.source ? `<div><div class="${cls}" data-id="${e.id}">${summary(e)}${badge}</div></div>` : "<div></div>";
          }
        }
        lanes.innerHTML = html;
      }

      lanes.addEventListener("click", (ev) => {
        const el = ev.target.closest(".ev");
        if (!el) return;
        document.querySelectorAll(".ev.sel").forEach((x) => x.classList.remove("sel"));
        el.classList.add("sel");
        const e = byId[el.dataset.id];
        const ls = D.links.filter((l) => l.from === e.id || l.to === e.id);
        detail.innerHTML = `<h3>${e.id}: ${e.action}</h3><p>${e.occurredAt}</p>
          <h4>correlation</h4><pre>${JSON.stringify(e.correlation, null, 1).replace(/[0-9a-f]{40}/g, (m) => label(m))}</pre>
          <h4>links (${ls.length})</h4>` +
          ls.map((l) => {
            const other = byId[l.from === e.id ? l.to : l.from];
            return `<div style="margin-bottom:6px"><span class="badge c-${l.confidence}">${l.confidence}</span> ${l.from === e.id ? "→" : "←"} ${other.id} ${other.action}<br><span class="muted">${l.evidence.map((x) => x.kind + (x.detail ? " (" + x.detail + ")" : "")).join(", ")}</span></div>`;
          }).join("");
      });
      sel.addEventListener("change", render);
      render();
    </script>
  </body>
