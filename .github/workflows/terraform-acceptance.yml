name: Terraform Afe acceptance
on:
  pull_request:
    paths:
      - apps/**
      - packages/**
      - tools/terraform-report.py
      - examples/**
      - pnpm-lock.yaml
      - .github/workflows/terraform-acceptance.yml
  push:
    branches: [main]
    paths:
      - apps/**
      - packages/**
      - tools/terraform-report.py
      - examples/**
      - pnpm-lock.yaml
      - .github/workflows/terraform-acceptance.yml
permissions:
  contents: read
jobs:
  terraform:
    name: Real Terraform lifecycle through Afe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afe_terraform_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/afe_terraform_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - name: Prepare browser capture
        run: |
          npm install --prefix "$RUNNER_TEMP/afe-preview" --no-package-lock --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/afe-preview/node_modules/.bin/playwright" install --with-deps chromium
          cp examples/ci/terraform-capture.mjs "$RUNNER_TEMP/afe-preview/terraform-capture.mjs"
      - name: Plan, apply, change, fail and destroy through Afe
        env:
          AFE_CAPTURE_SCRIPT: ${{ runner.temp }}/afe-preview/terraform-capture.mjs
        run: python3 examples/ci/terraform-afe.py
      - name: Upload metadata and browser evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-afe-evidence
          path: terraform-evidence/
          retention-days: 14
          if-no-files-found: error
