name: Container image

# Tagged releases (v*) build a multi-arch image and push it to GHCR with
# provenance and SBOM attestations. Pull requests that touch the image build it
# (amd64, not pushed) and run the docker-compose quickstart as a smoke test.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - .env.example
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - apps/server/package.json
      - apps/server/tsup.config.ts
      - .github/workflows/release.yml
      # In-cluster ArgoCD agent image (AFE-28)
      - apps/argocd-agent/**
      - packages/connector-argocd/src/agent-protocol.ts
      - packages/connector-argocd/src/sse.ts

permissions:
  contents: read

env:
  IMAGE: ghcr.io/theafeai/afe
  AGENT_IMAGE: ghcr.io/theafeai/afe-argocd-agent

jobs:
  smoke:
    name: Build image and run compose quickstart
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: afe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the quickstart stack
        run: |
          mkdir -p secrets && chmod 700 secrets
          openssl rand -base64 32 > secrets/afe_encryption_key
          chmod 644 secrets/afe_encryption_key
          openssl rand -hex 32 > secrets/afe_admin_token
          chmod 644 secrets/afe_admin_token
          cp .env.example .env
          sed -i -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" \
            -e "s/^AFE_VERSION=.*/AFE_VERSION=ci/" -e "s|^# AFE_IMAGE=.*|AFE_IMAGE=afe|" .env
          docker compose up -d
          # The worker deliberately has no HTTP healthcheck. Wait for the
          # server (and its database dependency), then check worker liveness.
          docker compose up -d --wait --wait-timeout 180 afe-server
      - name: Check health, web UI and CLI
        run: |
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/events)" = 401
          curl -fsS -o /dev/null -H "Authorization: Bearer $(cat secrets/afe_admin_token)" http://127.0.0.1:8080/api/events
          docker compose exec -T afe-server afe reencrypt-credentials
          test "$(docker inspect --format '{{.State.Health.Status}}' afe-afe-server-1)" = healthy
          test "$(docker inspect --format '{{.State.Running}}' afe-afe-worker-1)" = true
          test "$(docker inspect --format '{{.RestartCount}}' afe-afe-worker-1)" = 0
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  release:
    name: Build and push multi-arch image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Build provenance attestation (actions/attest-build-provenance).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 -> 1.2.3, 1.2, 1 and latest (latest only for non-prerelease tags);
          # no major-only tag while on 0.x.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          flavor: |
            latest=auto
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # In-cluster ArgoCD agent (AFE-28): a separate, minimal image.
  agent-smoke:
    name: Build the ArgoCD agent image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/argocd-agent/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: afe-argocd-agent:ci
          cache-from: type=gha,scope=argocd-agent
          cache-to: type=gha,mode=max,scope=argocd-agent
      - name: Runs non-root on a read-only root filesystem and validates its config
        run: |
          test "$(docker inspect --format '{{.Config.User}}' afe-argocd-agent:ci)" = "65532:65532"
          set +e
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            afe-argocd-agent:ci > out.txt 2>&1
          code=$?
          set -e
          cat out.txt
          test "$code" = 2
          grep -q "AFE_URL is required" out.txt

  agent-release:
    name: Build and push the ArgoCD agent image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.AGENT_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          flavor: |
            latest=auto
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/argocd-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=argocd-agent
          cache-to: type=gha,mode=max,scope=argocd-agent
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.AGENT_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
